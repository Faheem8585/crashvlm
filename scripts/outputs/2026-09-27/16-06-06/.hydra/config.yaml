seed: 42
paths:
  root: ${oc.env:CRASHVLM_DATA,data}
  api_cache: ${paths.root}/raw/api
  interim: ${paths.root}/interim
  processed: ${paths.root}/processed
  tmp: ${paths.root}/tmp
  reports: reports
catalog:
  test_types:
  - NEW CAR ASSESSMENT TEST
  - OPTIONAL NEW CAR ASSESSMENT TEST
  configs:
  - VTB
  - ITV
  - VTP
  min_year: 2012
  workers: 8
selection:
  per_config:
    VTB: 40
    ITV: 30
    VTP: 30
  split:
    train: 0.6
    val: 0.15
    test: 0.25
  iaa_tests: 15
  frozen: configs/splits/selection_v1.csv
clips:
  roles:
  - exterior
  - occupant
  splits:
  - train
  - val
  - test
  stride: 4
  max_side: 512
  jpeg_quality: 90
  analysis_every: 25
  max_file_mb: 200
  keep_raw: false
  limit: null
  shard: 0
  num_shards: 1
overlay:
  band_max_frac: 0.4
  band_uniform_frac: 0.6
  band_static_frac: 0.9
  band_max_gap_frac: 0.01
  band_tol: 12
  text_persist_frac: 0.8
  text_max_drift: 0.01
  text_edge_frac: 0.12
  text_edge_persist_frac: 0.3
  text_margin: 6
  indicator_min_area: 100
  fill: 127
timing:
  convention_t0_frame: 50
  convention_ms_per_frame: 1.0
annotation:
  ontology: configs/ontology.yaml
  prompts: configs/prompts.yaml
  out: ${paths.root}/annotation
  zero_shot_preds: null
  pass_name: pass_a
  annotator: A
  cvat_export: null
  images_zip: ${annotation.out}/pass_a/images.zip
  batch_size: 32
  model: null
embed:
  backbone: siglip:google/siglip2-so400m-patch14-384
  batch_size: 32
m3:
  labels: annotations/claude_pass_a.json
  backbones:
  - google__siglip2-so400m-patch14-384
  - resnet50
  events:
    airbag_deploy_start:
    - occupant
    head_contact:
    - occupant
    windshield_crack_onset:
    - exterior
    - occupant
    side_glass_break_onset:
    - exterior
    - occupant
  events_t0_unknown:
    impact_onset:
    - exterior
    airbag_deploy_start:
    - occupant
    head_contact:
    - occupant
    windshield_crack_onset:
    - exterior
    - occupant
    side_glass_break_onset:
    - exterior
    - occupant
  window_jitter_ms: 40
  tolerances_ms:
  - 8
  - 16
  - 32
  probe_C:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  thresholds:
  - 0.3
  - 0.4
  - 0.5
  - 0.6
  - 0.7
  - 0.8
  min_run: 2
  smooth: 3
  bootstrap: 1000
  seed: 42
  out: reports/m3
serve:
  backbone: google__siglip2-base-patch16-224
  hub_model: google/siglip2-base-patch16-224
  step_ms: 8
  max_frames: 60
  use_ocr: true
