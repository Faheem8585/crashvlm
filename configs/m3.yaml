# M3: CLIP-type baseline + classic CV reference.
defaults:
  - annotation
  - _self_

embed:
  backbone: siglip:google/siglip2-so400m-patch14-384
  batch_size: 32

m3:
  labels: annotations/claude_pass_a.json
  backbones: [google__siglip2-so400m-patch14-384, resnet50]   # feature files to evaluate
  # Tier-A events only (docs/ANNOTATION_QA.md). impact_onset is excluded: its label is the
  # lab-measured t0 itself, so any model is scored against the axis it was defined on.
  events:
    airbag_deploy_start: [occupant]
    head_contact: [occupant]
    windshield_crack_onset: [exterior, occupant]
    side_glass_break_onset: [exterior, occupant]
  events_t0_unknown:
    impact_onset: [exterior]
    airbag_deploy_start: [occupant]
    head_contact: [occupant]
    windshield_crack_onset: [exterior, occupant]
    side_glass_break_onset: [exterior, occupant]
  window_jitter_ms: 40        # t0-unknown setting: random crop of the clip start
  tolerances_ms: [8, 16, 32]
  probe_C: [0.01, 0.1, 1.0, 10.0]
  thresholds: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
  min_run: 2
  smooth: 3
  bootstrap: 1000
  seed: 42
  out: reports/m3
