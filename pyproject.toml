[project]
name = "crashvlm"
version = "0.1.0"
description = "Vision-language evaluation of vehicle crash test videos (NHTSA NCAP)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Muhammad Faheem Arshad" }]
dependencies = [
    "av>=14.0",
    "hydra-core>=1.3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "pyarrow>=16.0",
    "rapidocr-onnxruntime>=1.4.4",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU / model work (M2 zero-shot pre-labels onward). On Colab: pip install -e ".[ml]"
ml = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.56", "sentencepiece>=0.2", "protobuf>=4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crashvlm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # independent of the editable-install .pth (macOS can hide it)
addopts = "-q"
